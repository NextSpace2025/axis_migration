<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>데이터 구조 검토 · Axis Migration</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#536176;--line:#d5dfe9;--paper:#fff;--panel:#f2f5f9;--accent:#194f88}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:14px/1.55 system-ui,sans-serif}
::selection{background:#d9e8ff;color:var(--ink)}h1,h2,h3,p{margin:0}h1{font-size:25px}h2{font-size:19px}h3{font-size:15px}
a{color:var(--accent);text-underline-offset:3px}button,input,select{font:inherit;color:inherit}
button,input,select{padding:7px 10px;border:1px solid #9aaec3;border-radius:5px;background:white}
button{cursor:pointer}button:hover{background:#e8eff8}button:disabled,select:disabled,input:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid #ac6b0c;outline-offset:2px}
header,nav,footer{padding:13px max(20px,calc((100vw - 1500px)/2));border-bottom:1px solid var(--line)}
header{background:var(--panel);padding-top:21px;padding-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px 20px;flex-wrap:wrap}
.review-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
header p,.muted,small{color:var(--muted)}header p{overflow-wrap:anywhere;margin-top:4px}
nav,.toolbar,footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}nav button[aria-current=true]{background:#dce9f8;border-color:#9bb2d0;font-weight:650}
#counts{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
main{max-width:1500px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,30%);gap:22px;align-items:start}
main>div{min-width:0}.toolbar{margin-bottom:18px}.toolbar input[type=search]{flex:1;min-width:min(100%,180px)}
.toolbar label{display:flex;align-items:center;gap:5px}.toolbar label input{accent-color:var(--accent)}
.group{margin-bottom:24px}.group>p{color:var(--muted);margin:3px 0 10px}
.scroll{overflow:auto;border:1px solid var(--line);max-height:60vh}table{border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{position:sticky;top:0;background:var(--panel);white-space:nowrap;z-index:1}tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#fafbfd}td input{width:100%;min-width:126px}td select{min-width:100px}
td small{display:block;margin-top:2px}.source-head{min-width:134px}.value{min-width:90px}.issue{color:#774c05}
.text-button{border:0;background:transparent;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:3px;padding:2px 0;overflow-wrap:anywhere}
aside{background:var(--panel);border:1px solid var(--line);padding:16px;position:sticky;top:14px;overflow-wrap:anywhere}
aside dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 14px}aside dt{font-weight:650}aside dd{margin:0;white-space:pre-wrap}
.schema-scroll{overflow:auto;border:1px solid var(--line);background:#f7f9fc;margin:12px 0 18px}
.schema-stage{position:relative;max-width:720px;min-width:370px;margin:auto}
.schema-stage svg{position:absolute;inset:0;width:100%;height:100%}
.schema-edge{fill:none;stroke:#647d99;stroke-width:1.9;vector-effect:non-scaling-stroke}
.schema-edge-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.schema-edge-pair:hover .schema-edge,.schema-edge-pair.selected .schema-edge{stroke:var(--accent);stroke-width:3}
.schema-table{position:absolute;height:64px;text-align:left;padding:8px 10px}
.schema-table strong,.schema-table small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schema-table[aria-pressed=true],.schema-link[aria-pressed=true]{background:#dce9f8;border-color:var(--accent)}
.schema-list{list-style:none;padding:0;display:grid;gap:6px;margin:7px 0 0}
.schema-link{text-align:left;max-width:100%;overflow-wrap:anywhere}
.schema-example,#schema-source{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
#schema-source:empty{display:none}
.schema-detail{margin:8px 0}
.schema-example ul{margin:4px 0 0;padding-left:18px}
#evidence{max-height:calc(100vh - 95px);overflow:auto}
iframe{display:block;width:100%;height:310px;border:1px solid var(--line);background:#fff;margin-top:12px}
#message{flex:1;min-width:200px}#message[data-error=true]{color:#9a261f}.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:650}.primary:hover{background:#123c68}
#message:empty{display:none}
@media(max-width:850px){main{grid-template-columns:minmax(0,1fr);gap:14px}aside{position:static}#evidence{max-height:none}.scroll{max-height:48vh}}
</style>
</head>
<body>
<header>
  <div><h1>데이터 구조 검토</h1><p id="folder"></p></div>
  <div class="review-actions">
    <span id="message" role="status" aria-live="polite"></span>
    <button id="save">검토 저장</button>
    <button id="approve" class="primary">이 구조로 확정하고 변환</button>
  </div>
</header>
<nav class="axis-review-tabs" aria-label="검토 화면">
  <button data-view="structure" aria-current="true">관계도</button>
  <button data-view="purposes">업무별 헤더</button>
  <button data-view="headers">헤더 검토</button>
  <button data-view="preview">적용 미리보기</button>
  <button data-view="coverage">폴더 전체 확인</button>
  <span id="counts"></span>
</nav>
<main>
  <div>
    <div class="toolbar" id="filters" hidden>
      <input id="header-search" type="search" aria-label="헤더 또는 원본 표기 검색" placeholder="헤더 또는 원본 표기 검색">
      <label><input type="checkbox" id="issues"> 확인 필요만</label>
      <button id="accept">근거가 있는 헤더 일괄 적용</button>
    </div>
    <div id="content"></div>
  </div>
  <aside id="evidence" aria-label="선택한 항목의 근거" tabindex="-1">
    <h2>설계 근거</h2><p class="muted">관계도에서 표나 연결선을 선택하세요.</p>
  </aside>
</main>
<script>
const {proposal, decisions, folder} = /* AXIS_DATA */;
const reviewBase = window.AXIS_REVIEW_BASE || "";
let lastSaved = structuredClone(decisions);
let view = "structure";
let structureSelection = null;
let busy = false;
let approved = false;
const byId = id => document.getElementById(reviewBase && id === "evidence" ? "inspector" : id);
const reviewTabs = document.querySelectorAll(".axis-review-tabs [data-view]");
const content = byId("content");
const labels = {pending:"미결정", use:"적용", raw_only:"원문 보관"};
const statuses = {typed_mapped:"구조에 포함", raw_only:"원문 보관", unresolved:"확인 필요", excluded:"제외"};
const cellText = value => value === null ? "값 없음" : value === "" ? "빈 문자열" : value;
const node = (parent, tag, text, className) => {
  const child = document.createElement(tag);
  if (text !== undefined) child.textContent = text;
  if (className) child.className = className;
  parent.append(child);
  return child;
};
byId("folder").textContent = folder + " · 원본 " + proposal.files.length + "개";
function tell(message, error = false) {
  byId("message").textContent = message;
  byId("message").dataset.error = error;
}
function counts() {
  const edits = Object.values(decisions).flat();
  const pending = edits.filter(edit => edit.action === "pending").length;
  const used = edits.filter(edit => edit.action === "use").length;
  byId("counts").textContent = `매핑 ${edits.length}개 · 적용 ${used} · 원문 보관 ${edits.length - used - pending} · 미결정 ${pending}`;
  byId("approve").disabled = busy || approved || pending > 0 || used === 0;
  byId("save").disabled = busy || approved;
  byId("accept").disabled = busy || approved;
}
function grid(parent, heads, summary) {
  const scroll = node(parent, "div", undefined, "scroll");
  scroll.tabIndex = 0;
  scroll.setAttribute("role", "region");
  scroll.setAttribute("aria-label", summary);
  const table = node(scroll, "table");
  const line = node(node(table, "thead"), "tr");
  for (const head of heads) node(line, "th", head).scope = "col";
  return node(table, "tbody");
}
function focusEvidence(panel) {
  panel.focus({preventScroll:true});
  if (panel.id === "schema-source") panel.scrollIntoView({block:"nearest"});
  else if (innerWidth <= 850) panel.scrollIntoView({block:"start"});
}
function evidence(row, cell, mapping, edit, panel = byId("evidence")) {
  panel.replaceChildren();
  node(panel, panel.id === "schema-source" ? "h3" : "h2", "원본 근거");
  const pairs = [["파일",row.file],["위치",cell.location],["원본 값",cellText(cell.original)],
    ["적용값",cellText(cell.applied)],["넣을 열",edit.column],["읽는 규칙",mapping.rule]];
  const definition = node(panel, "dl");
  for (const [term, value] of pairs) {
    node(definition, "dt", term);
    node(definition, "dd", value);
  }
  const link = node(panel, "a", "원본 파일 열기");
  link.href = reviewBase + "source/" + encodeURIComponent(row.file);
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  const isPDF = /\.pdf$/i.test(row.file);
  if (isPDF || /\.(png|jpe?g)$/i.test(row.file)) {
    const frame = node(panel, "iframe");
    frame.title = "원본 · " + row.file;
    frame.src = link.href + (isPDF && row.page ? "#page=" + row.page : "");
    link.href = frame.src;
  } else link.textContent = "원본 파일 받기";
  focusEvidence(panel);
}
function valueButton(parent, table, row, cell, panel) {
  const button = node(parent, "button", cellText(cell.applied), "text-button");
  button.setAttribute("aria-label", `${cellText(cell.applied)} · ${row.file} · ${cell.location} 근거 보기`);
  button.onclick = () => evidence(row, cell, table.mappings[cell.mapping], decisions[table.name][cell.mapping], panel);
}
function showHeaders(table, section) {
  const query = byId("header-search").value.trim().toLowerCase();
  const edits = decisions[table.name];
  const examples = new Map();
  for (const row of table.rows) for (const cell of row.cells) {
    if (!examples.has(cell.mapping)) examples.set(cell.mapping, [row, cell]);
  }
  const visible = table.mappings.map((mapping,index) => ({mapping,index})).filter(({mapping,index}) =>
    (!byId("issues").checked || Boolean(mapping.issue) || !examples.has(index)) &&
    [mapping.label,mapping.source_header,edits[index].column,table.label].some(value => value.toLowerCase().includes(query)));
  if (!visible.length) return false;
  const rows = grid(section, ["원본 표기","넣을 열","적용 예시","결정"], table.label + " 헤더");
  for (const {mapping,index} of visible) {
    const edit = edits[index];
    const line = node(rows, "tr");
    const source = node(line, "td", undefined, "source-head");
    node(source, "strong", mapping.source_header);
    node(source, "small", mapping.files.length + "개 파일 · " + mapping.meaning);
    if (mapping.issue) node(source, "small", mapping.issue, "issue");
    const target = node(line, "td");
    node(target, "small", mapping.label + " · " + mapping.type);
    const input = node(target, "input");
    input.value = edit.column;
    input.maxLength = 63;
    input.spellcheck = false;
    input.disabled = approved || busy;
    input.setAttribute("aria-label", table.label + " " + mapping.source_header + " 넣을 열");
    input.oninput = () => { edit.column = input.value; };
    const preview = node(line, "td", undefined, "value");
    if (examples.has(index)) {
      const [row,cell] = examples.get(index);
      valueButton(preview,table,row,cell);
      node(preview, "small", row.file + " · " + cell.location);
    } else node(preview, "small", "확인된 예시 없음");
    const select = node(node(line, "td"), "select");
    select.setAttribute("aria-label", table.label + " " + mapping.source_header + " 결정");
    for (const key of Object.keys(labels)) node(select, "option", labels[key]).value = key;
    select.value = edit.action;
    select.disabled = approved || busy;
    select.onchange = () => { edit.action = select.value; counts(); };
  }
  return true;
}
function showPreview(table, section) {
  const edits = decisions[table.name];
  const columns = [...new Set(edits.filter(edit => edit.action !== "raw_only").map(edit => edit.column))];
  if (!table.rows.length || !columns.length) {
    node(section, "p", "표시할 적용 예시가 없습니다.", "muted");
    return;
  }
  const rows = grid(section, ["원본 행",...columns],table.label + " 적용 결과");
  for (const row of table.rows) {
    const line = node(rows, "tr");
    const label = node(line, "th", row.file);
    label.scope = "row";
    node(label,"small",row.location);
    for (const column of columns) {
      const target = node(line,"td");
      for (const cell of row.cells) {
        const edit = edits[cell.mapping];
        if (edit.action !== "raw_only" && edit.column === column) {
          valueButton(node(target,"div"), table, row, cell);
        }
      }
      if (!target.hasChildNodes()) node(target,"span","—","muted");
    }
  }
}
function schemaElement(parent, tag, attributes) {
  const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, value);
  parent.append(element);
  return element;
}
function relationPath(from, to, index) {
  const offset = (index % 5 - 2) * 5;
  const sameColumn = from.left === to.left;
  const exitRight = sameColumn ? from.left > 270 : from.left < to.left;
  const enterRight = sameColumn ? exitRight : !exitRight;
  const x1 = from.left + (exitRight ? 164 : 0);
  const x2 = to.left + (enterRight ? 164 : 0);
  const direction = exitRight ? 1 : -1;
  const rail = sameColumn ? x1 + direction * 33 + offset : 270 + offset;
  const y1 = from.y + offset;
  const y2 = to.y + offset;
  if (from === to) {
    return `M ${x1} ${y1 - 9} H ${rail} V ${y1 + 9} H ${x1 + direction * 3}`;
  }
  return `M ${x1} ${y1} H ${rail} V ${y2} H ${x2 + (rail > x2 ? 3 : -3)}`;
}
function keyLabel(table, columns) {
  return columns.map(column => {
    const names = [...new Set(table.mappings.flatMap((field, index) => {
      const edit = decisions[table.name][index];
      return field.column === column && edit.action !== "raw_only" ? [edit.column] : [];
    }))];
    return names.join(" / ") || column;
  }).join(", ");
}
function schemaExample(section, table, row, keys, source) {
  const example = node(section, "div", undefined, "schema-example");
  node(example, "h3", table.label);
  node(example, "small", row.file + " · " + row.location);
  const matched = keys ? row.cells.filter(cell => keys.includes(table.mappings[cell.mapping].column)) : [];
  const cells = matched.length ? matched : row.cells;
  const list = node(example, "ul");
  for (const cell of cells) {
    const item = node(list, "li");
    node(item, "span", table.mappings[cell.mapping].source_header + " · ");
    valueButton(item, table, row, cell, source);
  }
}
function showStructureDetail(tables) {
  const panel = byId("evidence");
  panel.replaceChildren();
  const table = tables.get(structureSelection);
  const edge = Number.isInteger(structureSelection) ? proposal.relationships[structureSelection] : null;
  node(panel, "h2", table ? table.label : edge ? "연결 근거" : "설계 근거");
  if (!table && !edge) {
    node(panel, "p", "관계도에서 표나 연결선을 선택하세요.", "muted");
    return;
  }
  const examples = node(panel, "div");
  const source = node(panel, "div");
  source.id = "schema-source";
  source.tabIndex = -1;
  if (table) {
    node(examples, "p", "한 행 · " + table.row_meaning, "schema-detail");
    node(examples, "p", table.reason || "이 표를 나눈 이유는 별도 설계 문서에서 확인하세요.", "schema-detail");
    if (table.primary_key?.length) {
      node(examples, "p", "기본 키 · " + keyLabel(table, table.primary_key), "schema-detail");
    }
    if (!table.rows.length) node(examples, "p", "확인된 원본 예시가 없습니다.", "muted");
    for (const row of table.rows) schemaExample(examples, table, row, null, source);
    return;
  }
  const from = tables.get(edge.from_table);
  const to = tables.get(edge.to_table);
  node(examples, "p", `${from.label} (${keyLabel(from, edge.from_columns)}) → ${to.label} (${keyLabel(to, edge.to_columns)})`,
       "schema-detail");
  node(examples, "p", edge.reason, "schema-detail");
  if (!edge.examples.length) node(examples, "p", "두 표를 함께 보여줄 원본 예시가 없습니다.", "muted");
  for (const pair of edge.examples) {
    const group = node(examples, "div");
    schemaExample(group, from, from.rows[pair.from_row], edge.from_columns, source);
    schemaExample(group, to, to.rows[pair.to_row], edge.to_columns, source);
  }
}
function showStructure() {
  const edges = proposal.relationships || [];
  const tables = new Map(proposal.tables.map(table => [table.name, table]));
  if (reviewBase) {
    const graph = window.graphView?.state;
    structureSelection = graph?.edge ? Number(graph.edge.slice(5)) : graph?.node;
    showStructureDetail(tables);
    const hint = byId("visible-count");
    hint.textContent = `${graph?.visibleNodes.length ?? tables.size}개 표 · ${graph?.visibleEdges.length ?? edges.length}개 연결`;
    return;
  }
  const positions = new Map(proposal.tables.map((table, index) => [
    table.name, {left: index % 2 ? 324 : 52, y: 55 + Math.floor(index / 2) * 104}
  ]));
  node(content, "h2", "테이블 관계도");
  node(content, "p", "표나 연결선을 선택하면 설계 이유와 원본 예시를 볼 수 있습니다.", "muted");
  const scroll = node(content, "div", undefined, "schema-scroll");
  scroll.tabIndex = 0;
  scroll.setAttribute("role", "region");
  scroll.setAttribute("aria-label", "제안한 표와 관계");
  const stage = node(scroll, "div", undefined, "schema-stage");
  const height = Math.ceil(tables.size / 2) * 104 + 6;
  stage.style.height = height + "px";
  const svg = schemaElement(stage, "svg", {viewBox:`0 0 540 ${height}`, preserveAspectRatio:"none", "aria-hidden":"true"});
  const marker = schemaElement(schemaElement(svg, "defs", {}), "marker", {
    id:"schema-arrow", markerWidth:6, markerHeight:6, refX:5, refY:3, orient:"auto"
  });
  schemaElement(marker, "path", {d:"M 0 0 L 6 3 L 0 6 Z", fill:"#647d99"});
  const selections = [];
  function syncSelection() {
    for (const {key, button, line} of selections) {
      button.setAttribute("aria-pressed", String(structureSelection === key));
      if (line) line.classList.toggle("selected", structureSelection === key);
    }
    showStructureDetail(tables);
  }
  function select(key) {
    structureSelection = key;
    syncSelection();
    focusEvidence(byId("evidence"));
  }
  for (const [name, table] of tables) {
    const position = positions.get(name);
    const button = node(stage, "button", undefined, "schema-table");
    button.style.left = position.left / 5.4 + "%";
    button.style.width = 164 / 5.4 + "%";
    button.style.top = (position.y - 32) + "px";
    button.title = table.label + " · " + table.row_meaning;
    node(button, "strong", table.label);
    node(button, "small", table.row_meaning);
    button.onclick = () => select(name);
    selections.push({key:name, button});
  }
  if (edges.length) {
    node(content, "h3", "표 사이 연결");
    const list = node(content, "ul", undefined, "schema-list");
    edges.forEach((edge, index) => {
      const path = relationPath(positions.get(edge.from_table), positions.get(edge.to_table), index);
      const line = schemaElement(svg, "g", {class:"schema-edge-pair"});
      schemaElement(line, "path", {d:path, class:"schema-edge", "marker-end":"url(#schema-arrow)"});
      const hit = schemaElement(line, "path", {d:path, class:"schema-edge-hit"});
      hit.addEventListener("click", () => select(index));
      const from = tables.get(edge.from_table);
      const to = tables.get(edge.to_table);
      const button = node(node(list, "li"), "button", undefined, "schema-link");
      node(button, "strong", from.label + " → " + to.label);
      node(button, "small", " · " + keyLabel(from, edge.from_columns) + " → " + keyLabel(to, edge.to_columns));
      button.onclick = () => select(index);
      selections.push({key:index, button, line});
    });
  } else {
    node(content, "p", proposal.relationships ? "제안한 연결 관계가 없습니다." :
         "이전 실행에는 관계도에 표시할 연결 정보가 없습니다. 새로 분석하면 연결을 검토할 수 있습니다.", "muted");
  }
  syncSelection();
}
function render() {
  content.replaceChildren();
  counts();
  if (reviewBase) document.body.dataset.view = view === "structure" ? "graph" : "table";
  byId("filters").hidden = view !== "headers";
  byId("filters").style.display = view === "headers" ? "" : "none";
  if (view === "structure") {
    showStructure();
    return;
  }
  if (view === "purposes") {
    for (const table of proposal.tables) {
      for (const purpose of table.purposes || []) {
        const section = node(content,"section",undefined,"group");
        node(section,"h2",purpose.question);
        node(section,"p",table.row_meaning + " · " + purpose.basis);
        const list = node(section,"ol");
        for (const index of purpose.headers) {
          const field = table.mappings[index];
          const item = node(list,"li");
          node(item,"strong",field.label);
          node(item,"small",field.source_header + " · " + field.meaning + " · " + field.rule);
          const sample = table.rows.find(row => row.cells.some(cell => cell.mapping === index));
          if (sample) valueButton(item, table, sample, sample.cells.find(cell => cell.mapping === index));
          if (field.issue || !sample) node(item,"small","추가 확인 · " + (field.issue || "원본 값"),"issue");
        }
        for (const gap of purpose.gaps) node(section,"p","추가 확인 · " + gap,"issue");
        const files = new Set(purpose.headers.flatMap(i => table.mappings[i].files));
        for (const file of files) {
          const link = node(section,"a",file);
          link.href = reviewBase + "source/" + encodeURIComponent(file);
          link.target = "_blank";
          node(section,"br");
        }
      }
    }
    if (!content.hasChildNodes()) node(content,"p","이 제안에는 업무 질문이 기록되지 않았습니다.");
    return;
  }
  if (view === "coverage") {
    node(content, "p", "제안 단계에서 확인한 전체 파일입니다. 헤더 변경은 변환 후 다시 검증합니다.", "muted");
    const rows = grid(content, ["파일","검토 상태","시트·페이지와 범위","관련 업무 질문"],"전체 원본 파일");
    for (const file of proposal.files) {
      const line = node(rows,"tr");
      node(line,"td",file.path);
      node(line,"td",statuses[file.status]);
      node(line,"td",file.detail);
      const related = node(line,"td");
      for (const table of proposal.tables) for (const purpose of table.purposes || []) {
        if (purpose.headers.some(i => table.mappings[i].files.includes(file.path))) {
          const button = node(related,"button",purpose.question);
          button.onclick = () => {
            document.querySelector('.axis-review-tabs [data-view="purposes"]').click();
            Array.from(content.querySelectorAll("h2")).find(h => h.textContent === purpose.question)?.scrollIntoView();
          };
        }
      }
    }
    return;
  }
  if (view === "preview") node(content,"p","실제 원본에서 읽은 예시입니다. 미결정 헤더는 현재 이름으로 표시합니다.","muted");
  for (const table of proposal.tables) {
    const section = node(content,"section",undefined,"group");
    node(section,"h2",table.label);
    node(section,"p",table.row_meaning);
    if (view === "headers" && !showHeaders(table,section)) section.remove();
    if (view === "preview") showPreview(table,section);
  }
  if (!content.hasChildNodes()) node(content,"p","조건에 맞는 헤더가 없습니다.","muted");
}
for (const button of reviewTabs) button.onclick = () => {
  view = button.dataset.view;
  const panel = byId("evidence");
  panel.replaceChildren();
  node(panel, "h2", "원본 근거");
  node(panel, "p", "적용값을 누르면 원본 위치와 값을 볼 수 있습니다.", "muted");
  for (const tab of reviewTabs) tab.setAttribute("aria-current", String(tab === button));
  render();
  if (reviewBase && view === "structure") requestAnimationFrame(() => window.graphView?.fit());
};
if (reviewBase) {
  document.addEventListener("axis:graph-render", () => queueMicrotask(() => {
    if (view === "structure") showStructure();
  }));
  window.addEventListener("beforeunload", event => {
    if (!approved && JSON.stringify(decisions) !== JSON.stringify(lastSaved)) event.preventDefault();
  });
}
byId("header-search").oninput = render;
byId("issues").onchange = render;
byId("accept").onclick = () => {
  for (const table of proposal.tables) {
    const evidenced = new Set(table.rows.flatMap(row => row.cells.map(cell => cell.mapping)));
    table.mappings.forEach((mapping,index) => {
      const edit = decisions[table.name][index];
      if (!mapping.issue && evidenced.has(index) && edit.action === "pending") edit.action = "use";
    });
  }
  render();
};
async function poll() {
  try {
    const status = await (await fetch(reviewBase + "status")).json();
    if (status.approved && !approved) { approved = true; render(); }
    if (status.approved) tell(status.message);
    if (status.result) { location.assign(status.result); return; }
    if (status.finished) return;
  } catch {
    tell("검토 서버에 연결할 수 없습니다. 터미널에서 작업 상태를 확인하세요.",true);
    return;
  }
  setTimeout(poll,1500);
}
async function submit(finalize) {
  busy = true;
  render();
  try {
    const response = await fetch(reviewBase + (finalize ? "approve" : "draft"), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({decisions,previous:lastSaved})
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    lastSaved = structuredClone(decisions);
    approved = finalize;
    tell(finalize ? "구조를 확정했습니다. SQLite 변환을 시작합니다." : "검토 내용을 저장했습니다.");
  } catch (error) {
    tell(error.message,true);
  } finally {
    busy = false;
    render();
  }
}
byId("save").onclick = () => submit(false);
byId("approve").onclick = () => submit(true);
render();
poll();
</script>
</body>
</html>
